name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Perl ${{ matrix.perl }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.42', '5.40', '5.38', '5.36']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      # libnghttp2 for Net::HTTP2::nghttp2 (HTTP/2 tests), OpenSSL headers
      # for IO::Socket::SSL (TLS tests). Both are optional to the server, so
      # they come in through the cpanfile's recommends.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libnghttp2-dev libssl-dev

      # --mirror-only: resolve versions from the mirror's own index rather than
      # cpanm's metadata service, which can name a release the mirrors have
      # not synced yet (the first run failed on exactly that).
      - name: Install dependencies
        run: cpanm --notest --mirror https://cpan.metacpan.org --mirror-only --installdeps .

      # The cpanfile lists these as recommends, which cpanm is allowed to fail
      # quietly; installed here on their own so a failure fails the job instead
      # of silently skipping the HTTP/2 and TLS tests.
      - name: Install optional modules the tests exercise
        run: cpanm --notest --mirror https://cpan.metacpan.org --mirror-only IO::Async::SSL Future::IO Alien::nghttp2

      # PAGI::Server needs Net::HTTP2::nghttp2 0.011. Until the CPAN mirrors
      # carry it, the pinned commit is the 0.011 tree from the binding's repo;
      # the CPAN install wins as soon as the mirrors catch up.
      - name: Install Net::HTTP2::nghttp2 0.011
        run: |
          cpanm --notest --mirror https://cpan.metacpan.org --mirror-only 'Net::HTTP2::nghttp2~0.011' \
            || cpanm --notest https://github.com/jjn1056/Net-HTTP2-nghttp2/archive/92e7f9e.tar.gz

      - name: Report what the server sees
        run: |
          perl -Ilib -MPAGI::Server -e 'print "PAGI::Server $PAGI::Server::VERSION\n"'
          perl -MFuture -e 'print "Future $Future::VERSION (", (Future->isa("Future::XS") ? "XS" : "PP"), ")\n"'
          perl -e 'print "Net::HTTP2::nghttp2 ", (eval { require Net::HTTP2::nghttp2; Net::HTTP2::nghttp2->VERSION } // "not installed"), "\n"'
          perl -e 'print "IO::Socket::SSL ", (eval { require IO::Socket::SSL; IO::Socket::SSL->VERSION } // "not installed"), "\n"'

      - name: Run tests
        run: prove -lr t/

  # A best-effort canary for the wider PAGI ecosystem: install the downstream
  # dists from CPAN against THIS checkout's PAGI::Server (via PERL5LIB, so a
  # change here that breaks them shows up rather than testing a released
  # server) and run their own test suites. Task::WebDyne::PAGI is the real
  # server canary -- it requires WebDyne + PAGI::Server + PAGI::Tools, and
  # WebDyne itself only *suggests* the PAGI glue, so the Task:: dist is what
  # pulls the integration. Thunderhorse and PAGI::FastAPI ride on PAGI /
  # PAGI::Tools rather than on the server. continue-on-error keeps a downstream
  # or CPAN hiccup from reddening PAGI-Server's own CI; drop it to make the
  # ecosystem gate the build.
  ecosystem:
    name: Ecosystem canary (Perl 5.42)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl 5.42
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libnghttp2-dev libssl-dev

      # Install this checkout's own dependencies so its PAGI::Server is a
      # working server for the downstream suites to load and run.
      - name: Install this PAGI-Server's dependencies
        run: cpanm --notest --mirror https://cpan.metacpan.org --mirror-only --installdeps .

      - name: Install optional modules
        run: cpanm --notest --mirror https://cpan.metacpan.org --mirror-only IO::Async::SSL Future::IO Alien::nghttp2

      - name: Install Net::HTTP2::nghttp2 0.011
        run: |
          cpanm --notest --mirror https://cpan.metacpan.org --mirror-only 'Net::HTTP2::nghttp2~0.011' \
            || cpanm --notest https://github.com/jjn1056/Net-HTTP2-nghttp2/archive/92e7f9e.tar.gz

      # PERL5LIB puts this checkout's PAGI::Server ahead of any CPAN release, so
      # cpanm sees the downstreams' PAGI::Server requirement already satisfied
      # and their suites run against the code in this tree.
      - name: Install and test the downstream ecosystem against this server
        env:
          PERL5LIB: ${{ github.workspace }}/lib
        run: |
          perl -e 'print "PAGI::Server the downstreams will see: $PAGI::Server::VERSION\n" if eval { require PAGI::Server; 1 }'
          cpanm --mirror https://cpan.metacpan.org --mirror-only \
            PAGI::Tools Task::WebDyne::PAGI Thunderhorse PAGI::FastAPI
